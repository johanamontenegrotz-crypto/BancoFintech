<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BancoFintech · Notificaciones</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

  <style>
  :root {
    --grad-start: #00a88f;
    --grad-end: #ffea00;
    --dark: #13313a;
    --card: rgba(255,255,255,0.95);
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
  html,body{height:100%;background: linear-gradient(to bottom right, #00a88f, #ffea00);background-attachment: fixed;}

  .app-container {max-width:420px;margin:auto;position:relative;padding-bottom:100px;min-height:100vh;}

  /* HEADER */
  header {
    background:#ffea00;
    color:var(--dark);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-radius:0 0 22px 22px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
  }

  .header-left {display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo {width:60px;height:60px;object-fit:contain;}
  .user-data h3{font-size:17px;margin-bottom:2px;font-weight:700;}
  .user-data p{font-size:14px;opacity:0.8;}
  .header-right {display:flex;gap:14px;}
  .header-right a {color:var(--dark);font-size:22px;text-decoration:none;}

  /* NOTIFICACIONES */
  .noti-list{
    margin:20px auto;
    max-width:380px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 8px 18px rgba(0,0,0,0.1);
    padding:10px;
    overflow-y:auto;
    max-height:65vh;
  }
  .noti-item{
    display:flex;
    flex-direction:column;
    background:var(--card);
    padding:12px 14px;
    border-radius:12px;
    margin-bottom:10px;
    font-size:14px;
    color:var(--dark);
    box-shadow:0 3px 6px rgba(0,0,0,0.1);
  }
  .noti-item strong{color:var(--dark);font-weight:700;}
  .noti-item span{font-size:13px;opacity:0.8;}

  /* BANNER DE NOTIFICACIÓN */
  .banner {
    position:fixed;
    top:-80px;
    left:50%;
    transform:translateX(-50%);
    background:var(--grad-end);
    color:var(--dark);
    padding:14px 18px;
    border-radius:0 0 16px 16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    z-index:999;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-width:300px;
    max-width:420px;
    transition:top 0.5s ease;
  }
  .banner i{cursor:pointer;}

  /* FOOTER */
  footer {
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:var(--dark);
    border-radius:30px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    width:92%;
    max-width:420px;
    padding:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
  }
  footer a {color:var(--grad-end);font-size:22px;text-decoration:none;}
  footer a.active {color:#fff;}
  .plus-btn {
    width:60px;height:60px;border-radius:50%;
    background:#fff;color:var(--dark);
    border:none;font-size:26px;
    transform:translateY(-20px);
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    cursor:pointer;
  }
  </style>
</head>

<body>
<div class="app-container">

  <!-- HEADER -->
  <header>
    <div class="header-left" onclick="window.location='home.html'">
      <img src="logo.png" alt="BancoFintech" class="logo">
      <div class="user-data">
        <h3>Notificaciones</h3>
        <p>BancoFintech</p>
      </div>
    </div>
    <div class="header-right">
      <a href="noti.html" class="active"><i class="fa-solid fa-bell"></i></a>
      <a href="perfil.html"><i class="fa-solid fa-user-circle"></i></a>
    </div>
  </header>

  <!-- LISTA DE NOTIFICACIONES -->
  <div class="noti-list" id="notiList">
    <!-- Notificaciones se agregan dinámicamente -->
  </div>
</div>

<!-- BANNER DE NOTIFICACIÓN -->
<div id="banner" class="banner hidden">
  <span id="bannerText">Nueva notificación</span>
  <i class="fa-solid fa-xmark" onclick="hideBanner()"></i>
</div>

<!-- FOOTER -->
<footer>
  <a href="home.html"><i class="fa-solid fa-house"></i></a>
  <a href="chat.html"><i class="fa-solid fa-comment-dots"></i></a>
  <button id="plusBtn" class="plus-btn" onclick="window.location='mas.html'"><i class="fa-solid fa-plus"></i></button>
  <a href="qr.html"><i class="fa-solid fa-qrcode"></i></a>
  <a href="configuracion.html"><i class="fa-solid fa-gear"></i></a>
</footer>

<script>
const notiList = document.getElementById('notiList');
const banner = document.getElementById('banner');
const bannerText = document.getElementById('bannerText');

// Mensajes de ejemplo
const mensajes = [
  "Transferencia recibida S/ 500.00 de Juan",
  "Robo de tarjeta detectado, verifique su cuenta",
  "Pago de luz S/ 150.00",
  "Depósito realizado S/ 1,000.00",
  "Alerta de actividad sospechosa",
  "Recordatorio: Pagar préstamo mensual",
  "Compra en Amazon S/ 200.00",
  "Transferencia enviada a Pedro S/ 300.00",
  "Suscripción Netflix S/ 34.90",
  "Pago recibido de María S/ 350.00"
];

// Crea notificaciones iniciales
for(let i=0;i<20;i++){
  const div = document.createElement('div');
  div.className='noti-item';
  div.innerHTML=`<strong>Notificación</strong><span>${mensajes[i%mensajes.length]}</span>`;
  notiList.appendChild(div);
}

// Función para mostrar banner
function showBanner(msg){
  bannerText.textContent = msg;
  banner.style.top='10px';
  setTimeout(()=>{banner.style.top='-80px';},5000);
}

// Función para ocultar banner
function hideBanner(){
  banner.style.top='-80px';
}

// Cada 20 minutos se agrega una nueva notificación
function addNotificacion(){
  const msg = mensajes[Math.floor(Math.random()*mensajes.length)];
  const div = document.createElement('div');
  div.className='noti-item';
  div.innerHTML=`<strong>Notificación</strong><span>${msg}</span>`;
  notiList.prepend(div);
  if(notiList.children.length>20) notiList.removeChild(notiList.lastChild); // Mantener máximo 20
  showBanner(msg);
}

// Se ejecuta al entrar a la página
addNotificacion();

// Cada 20 minutos = 20*60*1000 ms
setInterval(addNotificacion, 20*60*1000);
</script>
</body>
</html>
