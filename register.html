<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BancoFintech · Registro</title>
  <style>
    :root {
      --grad-start: #ffd400;
      --grad-end: #00b089;
      --dark: #13313a;
      --muted: #6b7a7f;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, var(--grad-start) 0%, #f7f6a2 20%, #b9f0d4 45%, var(--grad-end) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      width: 320px;
    }

    .logo-img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      border-radius: 16px;
      margin-bottom: 0px;
    }

    .form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--grad-start);
      color: #082;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }
    .btn-primary:hover {
      background: #eec800;
    }

    .small-note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 15px;
    }

    .small-note a {
      color: var(--dark);
      text-decoration: none;
      font-weight: 600;
    }

    .small-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <img src="img/Recurso 5@4x.png" alt="Logo BancoFintech" class="logo-img">

  <form class="form" id="registerForm">
    <input type="text" placeholder="Usuario o Nombre completo" required>
    <input type="email" placeholder="Correo o Email" required>
    <input type="password" placeholder="Contraseña" required>
    <button class="btn btn-primary" type="submit">Registrarse</button>
  </form>

  <p class="small-note">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault(); // evita buscar login.html
    // Redirige automáticamente a home.html
    window.location.href = 'home.html';
  });
</script>

</body>
</html>
