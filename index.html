<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BancoFintech · Bienvenida</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2b5a1f91d.js" crossorigin="anonymous"></script>
  <style>
  /* styles.css - banco fintech app (responsive, mobile-first) */
:root{
  --grad-start: #ffd400; /* amarillo */
  --grad-end: #00b089; /* verde */
  --dark: #13313a;
  --card: rgba(255,255,255,0.95);
  --muted: #6b7a7f;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:"Poppins",sans-serif}
html,body{height:100%}
.app-bg{
  min-height:100vh;
  background: linear-gradient(180deg,var(--grad-start) 0%, #f7f6a2 20%, #b9f0d4 45%, var(--grad-end) 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  color:var(--dark);
  -webkit-font-smoothing:antialiased;
}

/* general wrapper to center small cards like app screens */
.wrap{width:100%;max-width:420px;margin:18px auto;padding-bottom:80px}

/* center main on screen */
.center-app{display:flex;align-items:center;justify-content:center;min-height:80vh}

/* Cards */
.card{
  width:100%;
  background: rgba(255,255,255,0.96);
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

/* specific welcoming card */
.welcome-card{text-align:center;padding:28px 20px}
.logo-placeholder{
  display:inline-flex;align-items:center;justify-content:center;
  width:110px;height:110px;border-radius:18px;background:linear-gradient(180deg,#00b089,#ffd400);
  color:#072; font-weight:700; font-size:38px;
}
.logo-placeholder.small{width:80px;height:80px;font-size:30px}
.logo-placeholder.tiny{width:44px;height:44px;font-size:18px;border-radius:10px}

/* brand */
.brand{font-size:20px;color:var(--dark);font-weight:700;margin:12px 0}
.brand span{color:#13313a;font-weight:300}

/* buttons */
.btn{display:inline-block;padding:12px 16px;border-radius:14px;text-align:center;text-decoration:none;font-weight:700}
.btn-primary{background:var(--grad-start);color:#082;box-shadow:0 6px 12px rgba(0,0,0,0.08)}
.btn-secondary{background:var(--dark);color:#ffd;box-shadow:0 6px 12px rgba(0,0,0,0.12)}

.actions{display:flex;gap:10px;flex-direction:column;margin-top:14px}
.actions .btn{width:100%}

/* forms */
.form{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.form input{padding:12px;border-radius:12px;border:1px solid #e1e1e1;font-size:15px;text-align:center}
.small-note{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}

/* TOP CARD (amarillo) like UI design */
.top-card{
  width:100%;
  max-width:420px;
  background:var(--grad-start);
  border-radius:16px;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:16px auto 8px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  color:#083033;
}
.top-left{display:flex;align-items:center;gap:12px}
.user-greeting h3{font-size:18px;margin-bottom:4px;font-weight:700}
.user-greeting .muted{font-size:13px;color:rgba(0,0,0,0.6)}
.top-actions i{font-size:20px;margin-left:10px;cursor:pointer}

/* Features buttons white rounded */
.features-card{
  display:flex;
  gap:12px;
  justify-content:space-between;
  background:#fff;
  margin: -10px auto 14px;
  padding:12px;
  border-radius:12px;
  max-width:420px;
}
.feature-btn{flex:1;text-align:center;padding:8px;border-radius:10px;cursor:pointer}
.feature-btn i{display:block;font-size:20px;margin-bottom:6px;color:var(--dark)}
.feature-btn p{font-size:13px;margin:0;color:var(--dark)}

/* Saldo panel */
.saldo-panel{max-width:420px;margin:6px auto;padding:12px 16px;border-radius:14px;background:var(--dark);color:var(--grad-start)}
.saldo-row{display:flex;justify-content:space-between;align-items:center}
.saldo-right{display:flex;align-items:center;gap:8px}
.toggle-eye{cursor:pointer;font-size:18px}

/* transactions */
.tx-list{max-width:420px;margin:12px auto;padding:12px;background:#fff;border-radius:14px;max-height:320px;overflow:auto}
.tx-item{display:flex;justify-content:space-between;padding:12px;border-bottom:1px dashed #e6e6e6;font-size:14px}
.tx-item .desc{font-weight:600}
.tx-item .amt{color:var(--dark)}

/* carousel */
.cards-carousel{max-width:420px;margin:14px auto;position:relative;padding:8px 0}
.carousel-track{
  display:flex;gap:10px;overflow:hidden;padding:6px;
}
.card-item{
  min-width:260px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,0.08)
}
.card-item img{display:block;width:100%;height:auto}
.carousel-controls{display:flex;justify-content:center;gap:10px;margin-top:8px}
.small-circle{border-radius:50%;width:36px;height:36px;border:none;background:#13313a;color:#ffd;font-size:16px}

/* footer */
.app-footer{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:12px;width:92%;max-width:420px;display:flex;justify-content:space-around;
  align-items:center;padding:10px;background:var(--dark);border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,0.18)
}
.foot-item{color:var(--grad-start);font-size:18px;text-decoration:none}
.foot-item.active{color:#fff}
.plus-btn{width:60px;height:60px;border-radius:50%;background:var(--grad-start);border:none;color:var(--dark);font-size:22px;transform:translateY(-18px);box-shadow:0 8px 18px rgba(0,0,0,0.16)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal.hidden{display:none}
.modal-content{background:#fff;width:100%;max-width:420px;border-radius:14px;padding:18px;position:relative}
.modal-actions{display:flex;gap:10px;margin-top:10px;flex-direction:column}
.modal-close{position:absolute;right:8px;top:8px;border:none;background:transparent;font-size:18px;color:#888}

/* notifs */
.notif-list{max-width:420px;margin:14px auto;padding:12px;background:#fff;border-radius:14px;min-height:300px}
.notif-item{padding:14px;border-bottom:1px dashed #eee}

/* responsive tweaks */
@media(min-width:660px){
  .wrap{max-width:520px}
  .card-item{min-width:320px}
}
</style>
</head>
<body class="app-bg">
  <main class="wrap center-app">
    <section class="card welcome-card">
<!-- LOGO GRANDE - AQUI PONES TU IMG/SVG -->
<div class="logo-large" aria-hidden="true" style="margin-bottom:10px;">
  <!-- Logo real -->
  <img src="img/Recurso 1@4x.png" alt="BancoFintech Logo" 
       style="width:100px; height:100px; object-fit:contain; border-radius:12px;">
</div>

      <div class="actions">
        <a class="btn btn-primary" href="login.html">Iniciar sesión</a>
        <a class="btn btn-secondary" href="register.html">Registrarse</a>
      </div>
    </section>
  </main>
</body>
</html>
