<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BancoFintech · Movimiento</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
  :root {
    --grad-start: #00a88f;
    --grad-end: #ffea00;
    --dark: #13313a;
    --card: rgba(255,255,255,0.95);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
  html,body{
    height:100%;
    background: linear-gradient(to bottom right, #00a88f, #ffea00);
    background-attachment: fixed;
  }

  .app-container {
    max-width:420px;
    margin:auto;
    position:relative;
    padding-bottom:100px;
    min-height:100vh;
  }

  header {
    background:#ffea00;
    color:var(--dark);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-radius:0 0 22px 22px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
  }

  header h2{font-size:20px;font-weight:700;}
  .back-btn{color:var(--dark);font-size:22px;text-decoration:none;}

  .form-card{
    background:#fff;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    margin:20px auto;
    padding:20px;
    max-width:380px;
  }

  .form-card h3{margin-bottom:15px;color:var(--dark);}
  label{font-size:14px;color:var(--dark);font-weight:600;}
  input, select{
    width:100%;padding:10px;margin:6px 0 14px 0;
    border:1px solid #ccc;border-radius:10px;font-size:15px;
  }
  button{
    width:100%;padding:12px;
    border:none;border-radius:12px;
    font-size:16px;font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--grad-start);color:#fff;}
  .btn-primary:hover{background:#008f79;}
  .btn-secondary{background:var(--grad-end);color:var(--dark);}
  .saldo-box{
    background:var(--dark);
    color:var(--grad-end);
    border-radius:16px;
    padding:14px;
    text-align:center;
    font-weight:700;
    font-size:17px;
    margin:14px auto;
  }

  footer {
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:var(--dark);
    border-radius:30px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    width:92%;
    max-width:420px;
    padding:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
  }
  footer a {
    color:var(--grad-end);
    font-size:22px;
    text-decoration:none;
  }
  footer a.active {color:#fff;}
  .plus-btn {
    width:60px;height:60px;border-radius:50%;
    background:#fff;color:var(--dark);
    border:none;font-size:26px;
    transform:translateY(-20px);
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    cursor:pointer;
  }
  </style>
</head>

<body>
<div class="app-container">

  <header>
    <a href="home.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Nuevo Movimiento</h2>
    <span></span>
  </header>

  <div class="saldo-box">
    Saldo disponible: <span id="saldoActual">S/ 19,202.00</span>
  </div>

  <div class="form-card">
    <h3>Registrar Movimiento</h3>
    <label for="tipo">Tipo de operación:</label>
    <select id="tipo">
      <option value="transferencia">Transferencia</option>
      <option value="prestamo">Préstamo</option>
    </select>

    <label for="destinatario">Destinatario:</label>
    <input type="text" id="destinatario" placeholder="Ej: Juan Pérez">

    <label for="monto">Monto (S/):</label>
    <input type="number" id="monto" min="1" placeholder="Ej: 250">

    <label for="descripcion">Descripción:</label>
    <input type="text" id="descripcion" placeholder="Ej: Pago por servicio">

    <button class="btn-primary" id="btnRealizar">Realizar operación</button>
    <button class="btn-secondary" id="btnPDF" disabled><i class="fa-solid fa-file-pdf"></i> Descargar comprobante</button>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <a href="home.html" class="active"><i class="fa-solid fa-house"></i></a>
  <a href="chat.html"><i class="fa-solid fa-comment-dots"></i></a>

  <!-- BOTÓN CENTRAL PARA NUEVA TRANSFERENCIA -->
  <button id="plusBtn" class="plus-btn" title="Nueva Transferencia" onclick="window.location='mas.html'">
    <i class="fa-solid fa-plus"></i>
  </button>

  <a href="qr.html"><i class="fa-solid fa-qrcode"></i></a>
  <a href="configuracion.html"><i class="fa-solid fa-gear"></i></a>
</footer>


<script>
let saldo = 19202.00;
const saldoEl = document.getElementById("saldoActual");
const tipoEl = document.getElementById("tipo");
const destinatarioEl = document.getElementById("destinatario");
const montoEl = document.getElementById("monto");
const descEl = document.getElementById("descripcion");
const btnRealizar = document.getElementById("btnRealizar");
const btnPDF = document.getElementById("btnPDF");

let ultimaOperacion = null;

function actualizarSaldo(nuevoSaldo){
  saldo = nuevoSaldo;
  saldoEl.textContent = "S/ " + saldo.toLocaleString("es-PE",{minimumFractionDigits:2});
}

btnRealizar.addEventListener("click", ()=>{
  const tipo = tipoEl.value;
  const monto = parseFloat(montoEl.value);
  const dest = destinatarioEl.value.trim();
  const desc = descEl.value.trim();

  if(!monto || !dest){
    alert("Por favor completa todos los campos.");
    return;
  }

  if(tipo === "transferencia" && monto > saldo){
    alert("Saldo insuficiente para realizar la transferencia.");
    return;
  }

  let nuevoSaldo = saldo;
  if(tipo === "transferencia") nuevoSaldo -= monto;
  else if(tipo === "prestamo") nuevoSaldo += monto;

  actualizarSaldo(nuevoSaldo);

  ultimaOperacion = {
    tipo,
    destinatario: dest,
    monto,
    descripcion: desc,
    fecha: new Date().toLocaleString("es-PE")
  };

  alert("Operación realizada correctamente.");
  btnPDF.disabled = false;
});

btnPDF.addEventListener("click", ()=>{
  if(!ultimaOperacion) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFont("helvetica","bold");
  doc.setFontSize(18);
  doc.text("Comprobante de Movimiento", 20, 20);

  doc.setFontSize(13);
  doc.setFont("helvetica","normal");
  doc.text(`Tipo: ${ultimaOperacion.tipo}`, 20, 40);
  doc.text(`Destinatario: ${ultimaOperacion.destinatario}`, 20, 50);
  doc.text(`Monto: S/ ${ultimaOperacion.monto.toFixed(2)}`, 20, 60);
  doc.text(`Descripción: ${ultimaOperacion.descripcion || "Ninguna"}`, 20, 70);
  doc.text(`Fecha: ${ultimaOperacion.fecha}`, 20, 80);
  doc.text(`Saldo actual: ${saldoEl.textContent}`, 20, 90);

  doc.setFont("helvetica","italic");
  doc.text("BancoFintech · Sistema de Operaciones", 20, 110);

  doc.save("comprobante.pdf");
});
</script>

</body>
</html>
