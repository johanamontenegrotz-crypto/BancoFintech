<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BancoFintech · QR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root {
      --grad-start: #00a88f;
      --grad-end: #ffea00;
      --dark: #13313a;
      --card: rgba(255,255,255,0.95);
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
    html,body{height:100%;background: linear-gradient(to bottom right, #00a88f, #ffea00);}
    .app-container{max-width:420px;margin:auto;padding-bottom:100px;min-height:100vh;position:relative;}
    header{background:#ffea00;color:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:0 0 22px 22px;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
    .header-left{display:flex;align-items:center;gap:10px;}
    .logo{width:60px;height:60px;object-fit:contain;}
    .user-data h3{font-size:17px;margin-bottom:2px;font-weight:700;}
    .user-data p{font-size:14px;opacity:0.8;}
    .qr-section{background:#fff;border-radius:18px;box-shadow:0 8px 18px rgba(0,0,0,0.1);margin:30px auto;max-width:380px;padding:24px;text-align:center;}
    #qrCanvas{margin:20px auto;display:block;border-radius:12px;}
    .support{background:var(--dark);color:#fff;padding:18px;border-radius:18px;max-width:380px;margin:0 auto;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,0.2);}
    .support h3 {margin-bottom:8px;}
    .support p {font-size:14px;margin-bottom:10px;}
    .support button{background:var(--grad-end);color:var(--dark);border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;}
    footer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:var(--dark);border-radius:30px;display:flex;justify-content:space-around;align-items:center;width:92%;max-width:420px;padding:10px;box-shadow:0 10px 25px rgba(0,0,0,0.2);}
    footer a{color:var(--grad-end);font-size:22px;text-decoration:none;}
    footer a.active {color:#fff;}
    .plus-btn {width:60px;height:60px;border-radius:50%;background:#fff;color:var(--dark);border:none;font-size:26px;transform:translateY(-20px);box-shadow:0 6px 18px rgba(0,0,0,0.2);cursor:pointer;}
  </style>
</head>
<body>
<div class="app-container">
  <header>
    <div class="header-left">
      <img src="logo.png" alt="BancoFintech" class="logo">
      <div class="user-data">
        <h3>QR Bancario</h3>
        <p>Pagos y Transferencias</p>
      </div>
    </div>
    <div class="header-right">
      <a href="#"><i class="fa-solid fa-qrcode"></i></a>
    </div>
  </header>

  <section class="qr-section">
    <h2>Tu código QR</h2>
    <canvas id="qrCanvas" width="200" height="200"></canvas>
    <p>Escanea este código para pagar con BancoFintech.</p>
  </section>

  <section class="support">
    <h3>Soporte del Banco</h3>
    <p>¿Tienes algún problema? Habla directamente con un asesor por chat.</p>
    <button id="openChat"><i class="fa-solid fa-comments"></i> Abrir chat</button>
  </section>
</div>

<footer>
  <a href="home.html"><i class="fa-solid fa-house"></i></a>
  <a href="chat.html"><i class="fa-solid fa-comment-dots"></i></a>
  <button id="plusBtn" class="plus-btn" title="Nueva Transferencia" onclick="window.location='mas.html'"><i class="fa-solid fa-plus"></i></button>
  <a href="qr.html" class="active"><i class="fa-solid fa-qrcode"></i></a>
  <a href="configuracion.html"><i class="fa-solid fa-gear"></i></a>
</footer>

<script>
  // Botón chat
  document.getElementById('openChat').addEventListener('click',()=>{alert('Conectando con un asesor del BancoFintech...');});

  // QR funcional
  const qrCanvas = document.getElementById('qrCanvas');
  const qr = new QRious({
    element: qrCanvas,
    value: 'https://johanamontenegrotz-crypto.github.io/BancoFintech/pago.html?id=TRX171372&monto=28.18', // <--- URL completa
    size: 200,
    background: 'white',
    foreground: '#13313a'
  });
</script>
</body>
</html>
