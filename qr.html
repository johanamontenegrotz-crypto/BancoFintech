<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BancoFintech · QR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body {font-family: 'Poppins', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#00a88f;}
  h2 {color:#fff; margin-bottom:20px;}
  #qrcode {padding:20px; background:#fff; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.2);}
</style>
</head>
<body>

<h2>Escanea para pagar</h2>
<div id="qrcode"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // Aquí defines la URL de pago (puedes cambiar los parámetros dinámicamente si quieres)
  const paymentUrl = "pago.html?id=123456&monto=50.00";

  new QRCode(document.getElementById("qrcode"), {
    text: paymentUrl,
    width: 200,
    height: 200
  });
</script>

</body>
</html>
