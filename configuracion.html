<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BancoFintech · Configuración</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

  <style>
  :root {
    --grad-start: #00a88f;
    --grad-end: #ffea00;
    --dark: #13313a;
    --card: rgba(255,255,255,0.95);
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
  html,body{
    height:100%;
    background: linear-gradient(to bottom right, #00a88f, #ffea00);
    background-attachment: fixed;
  }

  .app-container {
    max-width:420px;
    margin:auto;
    position:relative;
    padding-bottom:100px;
    min-height:100vh;
  }

  header {
    background:#ffea00;
    color:var(--dark);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    border-radius:0 0 22px 22px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
  }
  header h2 {font-weight:700;font-size:18px;}

  .config-section {
    background:#fff;
    border-radius:18px;
    box-shadow:0 8px 15px rgba(0,0,0,0.1);
    margin:18px auto;
    padding:16px;
    max-width:380px;
  }
  .config-section h3 {
    color:var(--dark);
    font-size:16px;
    margin-bottom:10px;
    font-weight:700;
  }
  .config-item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid rgba(0,0,0,0.08);
    font-size:14px;
    color:var(--dark);
  }
  .config-item:last-child {border-bottom:none;}
  .config-item i {color:var(--grad-start);font-size:17px;margin-right:10px;}
  .config-item span {display:flex;align-items:center;}

  .chat-soporte {
    background:var(--dark);
    color:#fff;
    border-radius:14px;
    padding:16px;
    margin:18px auto;
    max-width:380px;
    text-align:center;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
  }
  .chat-soporte i {font-size:26px;color:var(--grad-end);margin-bottom:8px;}
  .chat-soporte button {
    margin-top:10px;
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:var(--grad-end);
    color:var(--dark);
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
  }

  .logout-btn {
    display:block;
    margin:30px auto;
    background:var(--dark);
    color:var(--grad-end);
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.25);
    transition:all 0.2s ease;
  }
  .logout-btn:hover {opacity:0.9;}

  footer {
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:var(--dark);
    border-radius:30px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    width:92%;
    max-width:420px;
    padding:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
  }
  footer a {
    color:var(--grad-end);
    font-size:22px;
    text-decoration:none;
  }
  footer a.active {color:#fff;}
  .plus-btn {
    width:60px;height:60px;border-radius:50%;
    background:#fff;color:var(--dark);
    border:none;font-size:26px;
    transform:translateY(-20px);
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    cursor:pointer;
  }
  </style>
</head>

<body>
<div class="app-container">

  <header>
    <h2>Configuración</h2>
  </header>

  <section class="config-section">
    <h3>Cuenta</h3>
    <div class="config-item">
      <span><i class="fa-solid fa-user"></i> Nombre de usuario</span>
      <p>Luana</p>
    </div>
    <div class="config-item">
      <span><i class="fa-solid fa-id-card"></i> ID de cliente</span>
      <p>872934</p>
    </div>
    <div class="config-item">
      <span><i class="fa-solid fa-bell"></i> Notificaciones</span>
      <p>Activadas</p>
    </div>
  </section>

  <section class="config-section">
    <h3>Seguridad</h3>
    <div class="config-item">
      <span><i class="fa-solid fa-lock"></i> Cambiar contraseña</span>
      <i class="fa-solid fa-chevron-right"></i>
    </div>
    <div class="config-item">
      <span><i class="fa-solid fa-fingerprint"></i> Autenticación biométrica</span>
      <p>Desactivada</p>
    </div>
    <div class="config-item">
      <span><i class="fa-solid fa-shield-halved"></i> Privacidad</span>
      <i class="fa-solid fa-chevron-right"></i>
    </div>
  </section>

  <div class="chat-soporte">
    <i class="fa-solid fa-headset"></i>
    <h3>Soporte del banco</h3>
    <p>¿Tienes alguna duda o problema? Habla directamente con nuestro asistente en línea.</p>
    <button onclick="window.location='chat.html'"><i class="fa-solid fa-comment-dots"></i> Abrir chat</button>
  </div>

  <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-door-open"></i> Cerrar sesión</button>

</div>

<!-- FOOTER -->
<footer>
  <a href="home.html"><i class="fa-solid fa-house"></i></a>
  <a href="chat.html"><i class="fa-solid fa-comment-dots"></i></a>

  <!-- BOTÓN CENTRAL PARA NUEVA TRANSFERENCIA -->
  <button id="plusBtn" class="plus-btn" title="Nueva Transferencia" onclick="window.location='mas.html'">
    <i class="fa-solid fa-plus"></i>
  </button>

  <a href="qr.html"><i class="fa-solid fa-qrcode"></i></a>
  <a href="configuracion.html" class="active"><i class="fa-solid fa-gear"></i></a>
</footer>


<script>
  const logoutBtn = document.getElementById('logoutBtn');
  logoutBtn.addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
